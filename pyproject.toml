[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-intelligence"
version = "0.1.0"
description = "Urban Flood Intelligence India (UFII): research pipeline for urban flood susceptibility and rainfall-conditioned inundation risk."
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
